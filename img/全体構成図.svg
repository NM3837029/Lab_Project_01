<svg viewBox="0 0 1410 820" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1410" height="820" fill="#ffffff"/>
  <text x="705" y="38" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">全体構成図</text>

  <!-- 制作者 -->
  <rect x="160" y="54" width="150" height="40" rx="8" fill="#f1f3f5" stroke="#8a94a0" stroke-width="1.5"/>
  <text x="235" y="79" text-anchor="middle" font-size="15" fill="#1f2937">制作者</text>
  <line x1="235" y1="94" x2="235" y2="107" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ================= Lab_Editor ================= -->
  <rect x="40" y="110" width="380" height="650" rx="14" fill="#f2f8fd" stroke="#2f6fb3" stroke-width="2"/>
  <text x="230" y="140" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f4e82">Lab_Editor</text>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#3a5a7a">ステージ編集ツール</text>

  <g font-size="12" fill="#333">
    <rect x="58" y="172" width="344" height="86" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/>
    <text x="74" y="199" font-size="15" font-weight="bold" fill="#1f4e82">キャンバス／ビューポート</text>
    <text x="74" y="221" >パン・ズーム・リサイズに対応した</text>
    <text x="74" y="239" >編集画面</text>

    <rect x="58" y="268" width="344" height="86" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/>
    <text x="74" y="295" font-size="15" font-weight="bold" fill="#1f4e82">レイヤー管理</text>
    <text x="74" y="317" >背景／地形／敵／アイテムを</text>
    <text x="74" y="335" >層に分けて編集</text>

    <rect x="58" y="364" width="344" height="86" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/>
    <text x="74" y="391" font-size="15" font-weight="bold" fill="#1f4e82">編集ツール</text>
    <text x="74" y="413" >配置／消しゴム／選択／移動</text>

    <rect x="58" y="460" width="344" height="86" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/>
    <text x="74" y="487" font-size="15" font-weight="bold" fill="#1f4e82">プロパティ編集</text>
    <text x="74" y="509" >敵の行動タイプ・アイテム種別・</text>
    <text x="74" y="527" >座標などを設定</text>

    <rect x="58" y="556" width="344" height="86" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/>
    <text x="74" y="583" font-size="15" font-weight="bold" fill="#1f4e82">パレット／UI</text>
    <text x="74" y="605" >使用する敵・アイテム・タイル・</text>
    <text x="74" y="623" >UI画像の一覧</text>

    <rect x="58" y="652" width="344" height="86" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/>
    <text x="74" y="679" font-size="15" font-weight="bold" fill="#1f4e82">保存・読み込み</text>
    <text x="74" y="701" >編集結果を共有データへ入出力</text>
  </g>

  <!-- ================= 共有データ ================= -->
  <rect x="460" y="110" width="330" height="650" rx="14" fill="#fdf7ec" stroke="#c98a2e" stroke-width="2"/>
  <text x="625" y="140" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a5a12">共有データ</text>

  <rect x="478" y="170" width="294" height="340" rx="8" fill="#fff" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="625" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a12">ステージ定義データ</text>
  <g font-size="12.5" fill="#333">
    <text x="498" y="242">・地形の配置</text>
    <text x="498" y="278">・敵の配置＋行動タイプ</text>
    <text x="498" y="314">・アイテムの配置</text>
    <text x="498" y="350">・開始位置／ゴール</text>
    <text x="498" y="386">・編集ツールの予算値</text>
  </g>

  <rect x="478" y="536" width="294" height="200" rx="8" fill="#fff" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="625" y="568" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a12">アセット</text>
  <g font-size="12.5" fill="#333">
    <text x="498" y="606">・画像（背景・キャラ・UI）</text>
    <text x="498" y="642">・効果音</text>
  </g>

  <!-- ================= ゲームランタイム ================= -->
  <rect x="830" y="110" width="440" height="650" rx="14" fill="#f1faf5" stroke="#3a8a5f" stroke-width="2"/>
  <text x="1050" y="140" text-anchor="middle" font-size="19" font-weight="bold" fill="#256346">ゲームランタイム</text>
  <text x="1050" y="160" text-anchor="middle" font-size="12" fill="#3d6b55">ゲーム本体</text>

  <g font-size="11.5" fill="#333">
    <rect x="848" y="172" width="404" height="74" rx="8" fill="#fff" stroke="#3a8a5f" stroke-width="1.5"/>
    <text x="864" y="197" font-size="15" font-weight="bold" fill="#256346">入力処理</text>
    <text x="864" y="219">キーボード操作を受け取る</text>

    <rect x="848" y="256" width="404" height="74" rx="8" fill="#fff" stroke="#3a8a5f" stroke-width="1.5"/>
    <text x="864" y="281" font-size="15" font-weight="bold" fill="#256346">ゲームループ／状態管理</text>
    <text x="864" y="303">ステージ進行・スコア・クリア判定</text>

    <rect x="848" y="340" width="404" height="74" rx="8" fill="#fff" stroke="#3a8a5f" stroke-width="1.5"/>
    <text x="864" y="365" font-size="15" font-weight="bold" fill="#256346">描画エンジン</text>
    <text x="864" y="387">背景・地形・キャラを画面へ描画</text>

    <rect x="848" y="424" width="404" height="74" rx="8" fill="#fff" stroke="#3a8a5f" stroke-width="1.5"/>
    <text x="864" y="449" font-size="15" font-weight="bold" fill="#256346">敵AI</text>
    <text x="864" y="471">行動タイプごとに敵を制御（追尾／巡回／待ち伏せ 等）</text>

    <rect x="848" y="508" width="404" height="74" rx="8" fill="#fff" stroke="#3a8a5f" stroke-width="1.5"/>
    <text x="864" y="533" font-size="15" font-weight="bold" fill="#256346">物理・当たり判定</text>
    <text x="864" y="555">重力・ジャンプ・足場・接触判定</text>

    <rect x="848" y="592" width="404" height="74" rx="8" fill="#fff" stroke="#3a8a5f" stroke-width="1.5"/>
    <text x="864" y="617" font-size="15" font-weight="bold" fill="#256346">アイテム／効果音</text>
    <text x="864" y="639">取得処理と効果音の再生</text>

    <rect x="848" y="676" width="404" height="74" rx="8" fill="#fff" stroke="#3a8a5f" stroke-width="1.5"/>
    <text x="864" y="701" font-size="15" font-weight="bold" fill="#256346">編集ツールギミック</text>
    <text x="864" y="723">ステージ内で編集ツールを使用し、ジャンプ・足場数を予算で管理</text>
  </g>

  <!-- ================= 接続 ================= -->
  <text x="447" y="420" text-anchor="middle" font-size="12" fill="#555">保存／読込</text>
  <line x1="420" y1="432" x2="474" y2="432" stroke="#555" stroke-width="2" marker-start="url(#arw)" marker-end="url(#arw)"/>

  <text x="801" y="420" text-anchor="middle" font-size="12" fill="#555">読み込み</text>
  <line x1="774" y1="432" x2="828" y2="432" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 画面出力 -->
  <rect x="1300" y="378" width="92" height="108" rx="10" fill="#f1f3f5" stroke="#8a94a0" stroke-width="1.5"/>
  <text x="1346" y="426" text-anchor="middle" font-size="14" fill="#1f2937">画面出力</text>
  <text x="1346" y="448" text-anchor="middle" font-size="13" fill="#1f2937">・操作</text>
  <line x1="1270" y1="432" x2="1298" y2="432" stroke="#555" stroke-width="2" marker-start="url(#arw)" marker-end="url(#arw)"/>

  <!-- フィードバックループ -->
  <path d="M1050 760 C 1050 792, 900 800, 655 800 C 410 800, 260 792, 260 760" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <rect x="558" y="786" width="194" height="26" rx="6" fill="#ffffff"/>
  <text x="655" y="804" text-anchor="middle" font-size="14" fill="#555">遊んで確認して修正</text>
</svg>
