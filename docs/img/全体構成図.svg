<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" font-family="Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4791f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="700" fill="#ffffff"/>

  <text x="20" y="34" font-size="21" font-weight="bold" fill="#1d1d1d">Lab Project 01 ── 全体構成</text>
  <text x="20" y="57" font-size="13" fill="#5a5a5a">エディタは JSON を書くだけ。ゲーム本体はその JSON を読んで動く。両者は直接つながっていない。</text>

  <!-- ============ 左：Lab_Editor ============ -->
  <rect x="20" y="80" width="300" height="470" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="2"/>
  <text x="36" y="108" font-size="16" font-weight="bold" fill="#1f4d7a">Lab_Editor</text>
  <text x="36" y="128" font-size="12" fill="#3a6a96">C# / .NET 8 / WinForms</text>
  <text x="36" y="145" font-size="12" fill="#3a6a96">48ファイル 18,796行</text>

  <rect x="36" y="160" width="268" height="52" rx="5" fill="#ffffff" stroke="#9dbdd9"/>
  <text x="48" y="180" font-size="13" font-weight="bold" fill="#1d1d1d">ステージ編集</text>
  <text x="48" y="199" font-size="11.5" fill="#4a4a4a">3層タイルマップ・敵/ギミック/アイテム配置</text>

  <rect x="36" y="222" width="268" height="52" rx="5" fill="#ffffff" stroke="#9dbdd9"/>
  <text x="48" y="242" font-size="13" font-weight="bold" fill="#1d1d1d">アセット管理</text>
  <text x="48" y="261" font-size="11.5" fill="#4a4a4a">当たり判定・サイズ・挙動パラメータ</text>

  <rect x="36" y="284" width="268" height="66" rx="5" fill="#fff8e8" stroke="#d8a93c" stroke-width="1.6"/>
  <text x="48" y="304" font-size="13" font-weight="bold" fill="#8a5d05">ブロックエディタ（Scratch風）</text>
  <text x="48" y="323" font-size="11.5" fill="#4a4a4a">命令73種をドラッグ&amp;ドロップで組む</text>
  <text x="48" y="340" font-size="11.5" fill="#4a4a4a">2パスレイアウト ＋ GDI+ 描画</text>

  <rect x="36" y="360" width="268" height="66" rx="5" fill="#fff8e8" stroke="#d8a93c" stroke-width="1.6"/>
  <text x="48" y="380" font-size="13" font-weight="bold" fill="#8a5d05">パーツ合成エディタ</text>
  <text x="48" y="399" font-size="11.5" fill="#4a4a4a">1体を複数画像で組み立てる</text>
  <text x="48" y="416" font-size="11.5" fill="#4a4a4a">回転する棒・振り子・公転の自動生成</text>

  <rect x="36" y="436" width="268" height="52" rx="5" fill="#ffffff" stroke="#9dbdd9"/>
  <text x="48" y="456" font-size="13" font-weight="bold" fill="#1d1d1d">ゲーム設定・タイトル画面</text>
  <text x="48" y="475" font-size="11.5" fill="#4a4a4a">ステージ一覧・解放条件・効果音の割り当て</text>

  <rect x="36" y="498" width="268" height="36" rx="5" fill="#ffffff" stroke="#9dbdd9"/>
  <text x="48" y="521" font-size="12.5" fill="#1d1d1d">配布zip作成 ／ Undo（上限50・JSON往復）</text>

  <!-- ============ 中央：assets ============ -->
  <rect x="360" y="80" width="230" height="470" rx="8" fill="#f2f2ef" stroke="#7a7a72" stroke-width="2"/>
  <text x="376" y="108" font-size="16" font-weight="bold" fill="#3d3d36">assets/*.json</text>
  <text x="376" y="128" font-size="12" fill="#63635b">唯一の受け渡し場所</text>

  <rect x="376" y="146" width="198" height="94" rx="5" fill="#ffffff" stroke="#b6b6ad"/>
  <text x="388" y="166" font-size="12.5" font-weight="bold" fill="#1d1d1d">アセット定義</text>
  <text x="388" y="185" font-size="11.5" fill="#4a4a4a">enemies.json    敵 23</text>
  <text x="388" y="202" font-size="11.5" fill="#4a4a4a">gimmicks.json  ギミック 36</text>
  <text x="388" y="219" font-size="11.5" fill="#4a4a4a">items.json         アイテム 13</text>
  <text x="388" y="236" font-size="11.5" fill="#4a4a4a">tiles.json           タイル 14</text>

  <rect x="376" y="250" width="198" height="94" rx="5" fill="#ffffff" stroke="#b6b6ad"/>
  <text x="388" y="270" font-size="12.5" font-weight="bold" fill="#1d1d1d">stages/*.json（7本）</text>
  <text x="388" y="289" font-size="11.5" fill="#4a4a4a">3層タイルマップ・配置</text>
  <text x="388" y="306" font-size="11.5" fill="#4a4a4a">背景レイヤー・イベント</text>
  <text x="388" y="323" font-size="11.5" fill="#4a4a4a">使える編集ツール</text>
  <text x="388" y="340" font-size="11.5" fill="#4a4a4a">編集コストの設定</text>

  <rect x="376" y="354" width="198" height="78" rx="5" fill="#fff8e8" stroke="#d8a93c" stroke-width="1.6"/>
  <text x="388" y="374" font-size="12.5" font-weight="bold" fill="#8a5d05">script（ブロックの木）</text>
  <text x="388" y="393" font-size="11.5" fill="#4a4a4a">エディタが書いた JSON AST を</text>
  <text x="388" y="410" font-size="11.5" fill="#4a4a4a">ゲーム側がそのまま実行する。</text>
  <text x="388" y="427" font-size="11.5" fill="#4a4a4a">中間形式への変換は無し</text>

  <rect x="376" y="442" width="198" height="46" rx="5" fill="#ffffff" stroke="#b6b6ad"/>
  <text x="388" y="462" font-size="12.5" font-weight="bold" fill="#1d1d1d">game_config.json</text>
  <text x="388" y="480" font-size="11.5" fill="#4a4a4a">タイトル画面・ステージ一覧・音</text>

  <rect x="376" y="498" width="198" height="36" rx="5" fill="#ffffff" stroke="#b6b6ad"/>
  <text x="388" y="521" font-size="11.5" fill="#4a4a4a">img/ 50枚 ・ sound/ 6 ・ se/ 21</text>

  <!-- ============ 右：ゲーム本体 ============ -->
  <rect x="630" y="80" width="390" height="470" rx="8" fill="#fdeeee" stroke="#b55050" stroke-width="2"/>
  <text x="646" y="108" font-size="16" font-weight="bold" fill="#8a2f2f">ゲーム本体</text>
  <text x="646" y="128" font-size="12" fill="#a05252">C++17 / DxLib 3.24f / 13,216行</text>
  <text x="646" y="145" font-size="12" fill="#a05252">内部640×480 → ウィンドウ1280×720 / 60fps</text>

  <rect x="646" y="160" width="358" height="52" rx="5" fill="#ffffff" stroke="#d9a0a0"/>
  <text x="658" y="180" font-size="13" font-weight="bold" fill="#1d1d1d">ゲームループ・シーン管理</text>
  <text x="658" y="199" font-size="11.5" fill="#4a4a4a">タイトル ⇄ ステージ選択 → プレイ ⇄ リザルト</text>

  <rect x="646" y="222" width="174" height="66" rx="5" fill="#ffffff" stroke="#d9a0a0"/>
  <text x="658" y="242" font-size="12.5" font-weight="bold" fill="#1d1d1d">物理・当たり判定</text>
  <text x="658" y="260" font-size="11" fill="#4a4a4a">AABB／X→Yの軸分離</text>
  <text x="658" y="277" font-size="11" fill="#4a4a4a">タイル・足場・ギミック</text>

  <rect x="830" y="222" width="174" height="66" rx="5" fill="#ffffff" stroke="#d9a0a0"/>
  <text x="842" y="242" font-size="12.5" font-weight="bold" fill="#1d1d1d">敵AI</text>
  <text x="842" y="260" font-size="11" fill="#4a4a4a">23種の行動タイプ</text>
  <text x="842" y="277" font-size="11" fill="#4a4a4a">ギミック26種</text>

  <rect x="646" y="298" width="358" height="76" rx="5" fill="#fdf2f2" stroke="#c46a6a" stroke-width="1.8"/>
  <text x="658" y="318" font-size="13" font-weight="bold" fill="#8a2f2f">巻き戻し（10秒 = 600フレーム）</text>
  <text x="658" y="337" font-size="11.5" fill="#4a4a4a">座標だけでなく敵のAI状態まで履歴に入れる（80B/体）</text>
  <text x="658" y="354" font-size="11.5" fill="#4a4a4a">跳ね返り角は rand() を使わずハッシュで決める＝毎回同じ</text>
  <text x="658" y="371" font-size="11.5" fill="#4a4a4a">目安 1.25MB（敵10・ギミック20・アイテム10のとき）</text>

  <rect x="646" y="384" width="358" height="76" rx="5" fill="#fdf2f2" stroke="#c46a6a" stroke-width="1.8"/>
  <text x="658" y="404" font-size="13" font-weight="bold" fill="#8a2f2f">編集ツール ＋ コストゲージ</text>
  <text x="658" y="423" font-size="11.5" fill="#4a4a4a">巻き戻し／一時停止／早送り／画面効果／個別編集／カット</text>
  <text x="658" y="440" font-size="11.5" fill="#4a4a4a">ステージごとにON/OFF。アイテムで恒久解放</text>
  <text x="658" y="457" font-size="11.5" fill="#4a4a4a">編集リアクション3階建て（共通層／JSON宣言／型別C++）</text>

  <rect x="646" y="470" width="358" height="64" rx="5" fill="#fff8e8" stroke="#d8a93c" stroke-width="1.6"/>
  <text x="658" y="490" font-size="13" font-weight="bold" fill="#8a5d05">BehaviorScript.h（669行）</text>
  <text x="658" y="509" font-size="11.5" fill="#4a4a4a">ツリーウォーク型インタプリタ。命令73種</text>
  <text x="658" y="526" font-size="11.5" fill="#4a4a4a">ループは1周＝1フレーム → 無限ループでも固まらない</text>

  <!-- ============ 矢印 ============ -->
  <line x1="322" y1="300" x2="356" y2="300" stroke="#3a3a3a" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="309" y="288" font-size="12" font-weight="bold" fill="#3a3a3a">書く</text>

  <line x1="592" y1="300" x2="626" y2="300" stroke="#3a3a3a" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="588" y="288" font-size="12" font-weight="bold" fill="#3a3a3a">読む</text>

  <!-- フィードバックループ -->
  <path d="M 820 566 L 820 600 L 170 600 L 170 566" fill="none" stroke="#b4791f" stroke-width="2.4" marker-end="url(#arrowLoop)"/>
  <rect x="330" y="586" width="360" height="28" rx="5" fill="#ffffff" stroke="#d8a93c"/>
  <text x="344" y="605" font-size="12.5" fill="#8a5d05">▶プレイ でゲームを起動 → 遊んで確かめて、また直す</text>

  <!-- 下部の注記 -->
  <rect x="20" y="628" width="1000" height="56" rx="6" fill="#f7f7f5" stroke="#c9c9c2"/>
  <text x="36" y="650" font-size="12.5" fill="#2d2d2d"><tspan font-weight="bold">語彙はC++、組み合わせはJSON。</tspan> 新しい型・新しい命令・新しい効果名を足すときだけ C++ を再ビルドする。</text>
  <text x="36" y="671" font-size="12.5" fill="#2d2d2d">それ以外（敵・ギミック・アイテム・タイル・ステージ・背景・音・タイトル画面・挙動スクリプト）は JSON だけで作れる。</text>
</svg>
